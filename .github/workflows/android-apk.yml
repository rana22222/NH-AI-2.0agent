name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      - name: Create Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org org.rana --project-name nh_ai_agent .
          fi

      - name: Raise minSdk to 24 for plugins
        run: |
          f=android/app/build.gradle
          [ -f "$f" ] || f=android/app/build.gradle.kts
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk\1 = 24/; s/minSdk(Version)? *=? *21/minSdk\1 = 24/' "$f"
          grep -n -i 'minsdk' "$f"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name:  h-ai-agent-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
