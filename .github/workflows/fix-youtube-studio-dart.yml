name: Fix YouTube Studio Dart type
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-youtube-studio-dart.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix subtitle duration type
        run: |
          sed -i 's/ceil().clamp(2, 7);/ceil().clamp(2, 7).toInt();/' lib/youtube_studio.dart
          grep -q 'ceil().clamp(2, 7).toInt();' lib/youtube_studio.dart
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/youtube_studio.dart
          git commit -m "Fix subtitle duration integer type" || exit 0
          git push
