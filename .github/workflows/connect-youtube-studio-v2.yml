name: Connect YouTube AI Studio v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-youtube-studio-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  connect-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect YouTube Studio page
        run: |
          python3 -c 'import re,pathlib; p=pathlib.Path("lib/main.dart"); s=p.read_text(encoding="utf-8"); q=chr(39); s=s.replace("import "+q+"notify.dart"+q+";", "import "+q+"notify.dart"+q+";\\nimport "+q+"youtube_studio.dart"+q+";"); s,n=re.subn(r"_buildCategory\\("+q+"ইউটিউব"+q+r",\\s*\\[.*?\\]\\),", "const YoutubeStudioPage(),", s, count=1, flags=re.S); assert n==1, "YouTube tab entry not found"; p.write_text(s, encoding="utf-8")'
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Connect YouTube AI Studio to main app" || exit 0
          git push
