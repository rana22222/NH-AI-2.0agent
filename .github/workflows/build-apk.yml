name: Build NH AI Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nhai --project-name nh_ai_agent .
          fi
      - name: Add internet permission
        run: |
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml && echo "INTERNET permission added"
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nh-ai-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
